name: Release

# Publishes a new version for automatic updates: builds the Windows installer and uploads it, with the
# update files (latest.yml, .blockmap), to the PUBLIC repo hamzaibnzakir/brainbox-virtualcam-releases.
# Only installers go there, never the source code. Installed apps check that repo every few hours.
#
# Release a version: bump "version" in package.json, commit, then push a tag:
#   git tag v1.2.0 && git push origin v1.2.0
# Needs the secret RELEASES_TOKEN: a fine-grained GitHub token with "Contents: read and write" on the
# brainbox-virtualcam-releases repo only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "Tag ${{ github.ref_name }} but package.json says $v"; exit 1 }

      - name: Check the publishing token is set
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Error "Add the RELEASES_TOKEN secret (see the top of this file)"; exit 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          npm run build
          npx electron-builder --win nsis --publish always
